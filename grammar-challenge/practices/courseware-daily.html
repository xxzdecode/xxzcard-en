<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0ff">
  <title>今日语法挑战</title>
  <link rel="stylesheet" href="../css/page-practice.css">
  <style>
    .manual-courseware-loading{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f3ff;color:#65499f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;text-align:center}
    .manual-courseware-loading div{max-width:560px;padding:24px;border-radius:22px;background:#fff;box-shadow:0 14px 40px rgba(101,73,159,.12)}
    .manual-courseware-loading h1{margin:0 0 8px;font-size:24px}.manual-courseware-loading p{margin:0;color:#756b7d;line-height:1.6}
  </style>
</head>
<body>
  <main class="manual-courseware-loading" id="manualCoursewareLoading">
    <div><h1>正在准备今日语法挑战</h1><p>从老师选定的随堂练习中抽取 10 题。</p></div>
  </main>
  <script>
    (async function bootManualCoursewareChallenge() {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const source = String(params.get('source') || '').trim();
      const practiceId = String(params.get('practiceId') || '').trim();
      const fallbackTitle = String(params.get('title') || '今日语法挑战').trim();
      const loading = document.getElementById('manualCoursewareLoading');

      function fail(message) {
        if (!loading) return;
        loading.innerHTML = `<div><h1>语法挑战没有打开</h1><p>${String(message || '练习内容暂时无法读取。')}</p></div>`;
      }

      function validSourcePath(value) {
        return /^courseware\/[^?#]+\.html$/i.test(value) && !value.includes('..');
      }

      function chooseBalancedQuestionIds(questions, limit) {
        const groups = new Map();
        questions.forEach(question => {
          const key = String(question && question.category || 'other');
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(question);
        });
        const queues = [...groups.values()].map(items => [...items]);
        const selected = [];
        while (selected.length < limit && queues.some(queue => queue.length)) {
          queues.forEach(queue => {
            if (selected.length >= limit || !queue.length) return;
            const index = Math.floor((queue.length - 1) / 2);
            selected.push(queue.splice(index, 1)[0]);
          });
        }
        return selected.map(question => question.id);
      }

      function loadScript(src, dataset) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          Object.entries(dataset || {}).forEach(([key, value]) => { script.dataset[key] = value; });
          script.onload = resolve;
          script.onerror = () => reject(new Error(`load failed: ${src}`));
          document.body.appendChild(script);
        });
      }

      try {
        if (!validSourcePath(source) || !practiceId) throw new Error('老师选择的练习路径无效。');
        const sourceUrl = new URL(`../../${source}`, window.location.href);
        const response = await fetch(sourceUrl.href, { cache: 'no-cache', credentials: 'same-origin' });
        if (!response.ok) throw new Error(`练习读取失败（${response.status}）。`);
        const html = await response.text();
        const parsed = new DOMParser().parseFromString(html, 'text/html');
        const data = parsed.getElementById('practice-data');
        if (!data) throw new Error('这条随堂练习没有可转换的题目数据。');

        const original = JSON.parse(data.textContent || 'null');
        const questions = Array.isArray(original && original.questions) ? original.questions : [];
        if (!questions.length) throw new Error('这条随堂练习暂时没有题目。');

        const size = Math.min(10, questions.length);
        const ids = chooseBalancedQuestionIds(questions, size);
        const lessonKey = `manual-courseware:${practiceId}`;
        const questionKpIds = Object.fromEntries(questions.map(question => [question.id, [lessonKey]]));
        const displayTitle = String(original.title || fallbackTitle).replace(/随堂练习/g, '语法挑战');

        window.__GRAMMAR_PAGE_PRACTICE_CONFIG__ = {
          ...original,
          id: `manual-courseware::${practiceId}`,
          title: displayTitle,
          interactionMode: 'challenge-locked',
          completionTitle: '挑战完成',
          completion: '今日语法挑战完成。',
          restartLabel: '重新挑战',
          continueLabel: '',
          continueHref: '',
          lessonKey,
          kpIds: [lessonKey],
          questionKpIds,
          round: {
            size,
            shuffle: true,
            groups: [{ ids, shuffle: true }]
          },
          questions
        };
        document.title = displayTitle;
        if (loading) loading.hidden = true;

        await loadScript('../js/page-practice-core.js');
        await loadScript('../js/page-practice-shell.js', {
          practicePath: sourceUrl.href,
          practiceId: `manual-courseware::${practiceId}`,
          embedded: '1'
        });
      } catch (error) {
        console.warn(error);
        fail(error && error.message ? error.message : '练习内容暂时无法读取。');
      }
    })();
  </script>
</body>
</html>
