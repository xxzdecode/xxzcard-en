name: Bootstrap grammar records module

on:
  push:
    branches:
      - agent/grammar-challenge-history
    paths:
      - '.github/workflows/bootstrap-grammar-records.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grammar-challenge-history
      - name: Generate module
        env:
          MODULE_GZIP_BASE64: 
      - name: Decode and commit
        run: |
          python - <<'PY'
          import base64, gzip, os, pathlib
          payload = os.environ['MODULE_GZIP_BASE64']
          target = pathlib.Path('js/grammarChallengeRecords.js')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/grammarChallengeRecords.js
          git rm .github/workflows/bootstrap-grammar-records.yml
          git commit -m "Implement grammar challenge history records"
          git push origin HEAD:agent/grammar-challenge-history
