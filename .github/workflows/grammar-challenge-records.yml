name: Grammar challenge records

on:
  push:
    branches:
      - main
      - agent/grammar-challenge-history
    paths:
      - 'js/grammarChallengeRecords.js'
      - 'js/main.js'
      - 'grammar-challenge/**'
      - 'tests/grammarChallengeRecords*'
      - 'tests/grammarOptionEditing.test.js'
      - 'package.json'
      - 'service-worker.js'
      - '.github/workflows/grammar-challenge-records.yml'
  pull_request:
    paths:
      - 'js/grammarChallengeRecords.js'
      - 'js/main.js'
      - 'grammar-challenge/**'
      - 'tests/grammarChallengeRecords*'
      - 'tests/grammarOptionEditing.test.js'
      - 'package.json'
      - 'service-worker.js'
      - '.github/workflows/grammar-challenge-records.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run grammar records and compatibility tests
        run: |
          node tests/grammarChallengeRecords.test.js
          node tests/grammarOptionEditing.test.js
          node tests/studentActivityControls.test.js
          node tests/studentActivityControls.browser-smoke.test.js
          node tests/studentHomeDashboard.test.js
          node tests/studentHomePerformance.test.js
      - run: npm run test:grammar-records-viewport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grammar-challenge-records-qa
          path: .codex-backups/grammar-challenge-records-qa
          if-no-files-found: ignore
