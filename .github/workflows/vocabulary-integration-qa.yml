name: Vocabulary Integration QA

on:
  push:
    branches:
      - agent/vocab-system-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm test

  webkit-vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npm run test:vocabulary-system-viewport
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-system-viewport-results
          path: test-results/
          if-no-files-found: ignore
