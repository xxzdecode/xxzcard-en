name: Apply PR 44 loader fix

on:
  push:
    branches:
      - agent/fix-adventure-loader-retry
    paths:
      - '.github/workflows/apply-pr44-loader-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-adventure-loader-retry
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize focused changes
        shell: bash
        run: |
          cat .github/pr44-payload/bootstrap.00 \
              .github/pr44-payload/bootstrap.01 \
              .github/pr44-payload/bootstrap.02 \
            | base64 --decode > js/vocabularyQuestionTypesRepeatBootstrap.js
          cat .github/pr44-payload/test.00 \
              .github/pr44-payload/test.01 \
            | base64 --decode > tests/vocabulary-adventure-bootstrap-loader.test.cjs
          node --check js/vocabularyQuestionTypesRepeatBootstrap.js
          node --check tests/vocabulary-adventure-bootstrap-loader.test.cjs

      - name: Run requested tests
        shell: bash
        run: |
          node --test tests/vocabulary-adventure-bootstrap-loader.test.cjs
          node --test tests/lazy-features-adventure-entry.test.cjs
          npm test

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/pr44-payload .github/workflows/apply-pr44-loader-fix.yml
          git add js/vocabularyQuestionTypesRepeatBootstrap.js tests/vocabulary-adventure-bootstrap-loader.test.cjs
          git commit -m 'fix: retry adventure support from real entries'
          git push origin HEAD:agent/fix-adventure-loader-retry
